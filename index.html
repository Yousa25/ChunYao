<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小椿遥 Haruka · 主页</title>
    <meta name="description" content="小椿遥 Haruka —— 甜音破碎感声线，温柔学姐也是闪耀偶像。每晚 22:22 直播，不见不散！">
    <style>
        :root {
            --pink: #ff8fb1;
            --pink-deep: #ff5c8a;
            --lav: #c5a3ff;
            --peach: #ffd9a0;
            --ink: #4a3547;
            --ink-soft: #7a6276;
            --card: rgba(255, 255, 255, 0.62);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            color: var(--ink);
            background: linear-gradient(135deg, #ffe3ec 0%, #f6e3ff 45%, #ffe9d6 100%);
            background-size: 220% 220%;
            animation: bgShift 16s ease-in-out infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 漂浮装饰 */
        .floaty {
            position: absolute;
            font-size: 26px;
            opacity: 0.55;
            user-select: none;
            pointer-events: none;
            animation: floatUp 12s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(20px) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.6;
            }

            85% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-90vh) rotate(20deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            background: var(--card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(255, 143, 177, 0.28);
            padding: 44px 36px 40px;
            text-align: center;
            animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 108px;
            height: 108px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background: radial-gradient(circle at 30% 25%, #fff, #ffd0de 55%, #ffb3c9);
            box-shadow: 0 10px 26px rgba(255, 92, 138, 0.3), inset 0 0 0 4px #fff;
            animation: bob 3.6s ease-in-out infinite;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--pink-deep), var(--lav));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--ink-soft);
            margin-bottom: 26px;
        }

        .lines {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .line {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 13px 16px;
            font-size: 15px;
            line-height: 1.5;
            text-align: left;
            box-shadow: 0 4px 14px rgba(255, 143, 177, 0.12);
        }

        .line .ico {
            flex: 0 0 auto;
            font-size: 20px;
        }

        .live-time {
            font-weight: 700;
            color: var(--pink-deep);
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            padding: 15px 34px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--pink-deep), var(--lav));
            box-shadow: 0 12px 28px rgba(255, 92, 138, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 36px rgba(255, 92, 138, 0.45);
        }

        .cta:active {
            transform: translateY(-1px);
        }

        .thanks {
            margin-top: 28px;
            font-size: 14px;
            color: var(--ink-soft);
            line-height: 1.6;
        }

        .ribbon {
            display: inline-block;
            margin-top: 16px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(255, 143, 177, 0.85);
            padding: 5px 14px;
            border-radius: 999px;
        }

        @media (max-width: 420px) {
            .card {
                padding: 36px 22px;
                border-radius: 22px;
            }

            .name {
                font-size: 28px;
            }

            .avatar {
                width: 92px;
                height: 92px;
                font-size: 44px;
            }
        }
    </style>
</head>

<body>

    <!-- 漂浮装饰粒子 -->
    <span class="floaty" style="left:8%;  animation-delay:0s;   font-size:22px;">✨</span>
    <span class="floaty" style="left:20%; animation-delay:3s;   font-size:18px;">🌸</span>
    <span class="floaty" style="left:34%; animation-delay:6s;   font-size:24px;">🎀</span>
    <span class="floaty" style="left:52%; animation-delay:1.5s; font-size:20px;">💗</span>
    <span class="floaty" style="left:66%; animation-delay:4.5s; font-size:22px;">✨</span>
    <span class="floaty" style="left:80%; animation-delay:2s;   font-size:18px;">🌸</span>
    <span class="floaty" style="left:90%; animation-delay:7s;   font-size:20px;">🎵</span>

    <main class="card">
        <div class="avatar">🌸</div>

        <h1 class="name">✨ 小椿遥Haruka ໒꒱ ✨</h1>
        <div class="subtitle">HARUKA · KOITSUBAKI</div>

        <div class="lines">
            <div class="line">
                <span class="ico">🎤</span>
                <span>甜音破碎感声线，是温柔学姐也是闪耀偶像喵～单推标志໒꒱</span>
            </div>
            <div class="line">
                <span class="ico">⏰</span>
                <span>直播时间：<span class="live-time">每晚 22:22</span>，不见不散！</span>
            </div>
            <div class="line">
                <span class="ico">🎵</span>
                <span>歌单指路 → <a href="songs.html"
                        style="color:var(--pink-deep); font-weight:700; text-decoration:underline;">歌单</a></span>
            </div>
        </div>

        <a class="cta" href="songs.html">🎵 进入专属歌单</a>

        <div class="thanks">
            💬 感谢关注！一起用声音传递温暖与力量吧～
        </div>

        <span class="ribbon">每晚 22:22 · 直播间见</span>
    </main>

</body>

</html>
